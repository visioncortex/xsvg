# Every gate the repo has, run on every push and pull request, so none of them
# depends on someone remembering. Two jobs: the Rust workspace (format, lints,
# tests, both wasm targets) and the web side (the wasm-pack builds, the
# packages, and the `npm run check:*` scripts, which drive the published Node
# compiler and the viewer's TypeScript against the dataset).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned to the toolchain the project is developed on, so a new stable release
  # (and the lints its clippy adds) cannot fail CI on code nobody touched. Raise it
  # deliberately, together with the local toolchain. The fuzz job needs nightly.
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  rust:
    name: Rust — fmt, clippy, tests, wasm targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # the fuzz harness is an example behind a feature, so the workspace pass skips it
      - name: Clippy, path-ops fuzz harness
        run: cargo clippy -p xsvg-path-ops --all-targets --features diagnostics -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Core without the compile feature (the primitives alone must build)
        run: cargo check -p xsvg-core
      # xsvg-path-ops is built for wasm by hosts (a browser runs it in a Worker
      # of its own), so it must keep compiling there though nothing here links it
      - name: wasm32 targets
        run: cargo build --target wasm32-unknown-unknown -p xsvg-wasm -p xsvg-ext-clipart -p xsvg-path-ops
      # seeds 1–3000 of the path-ops campaign under its 1 GiB memory jail: any
      # panic, stall, crash or wrong result fails (crates/xsvg-path-ops/FUZZ.md)
      - name: Path-ops regression range (memory-jailed)
        run: >
          cargo run --release -p xsvg-path-ops --features diagnostics --example fuzz --
          run --seed 1 --count 3000 --budget-secs 240 --mem-mib 1024 --out target/path-ops-check
          --fail-on panic,timeout,oom,crash,pixel,area,preserve,sliver,dup-points,nan

  web:
    name: Web — wasm-pack, packages, checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      # check:mesh renders through resvg and skips itself when resvg is absent;
      # installing it here turns the skip into a gate. The build is cached.
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: resvg

      - run: npm ci
      - name: Build (wasm, extension module, viewer, embed bundle)
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Inspector parameters
        run: npm run check:params
      - name: Host hooks
        run: npm run check:hosts
      - name: Plugin sandbox
        run: npm run check:sandbox
      - name: Incremental compile parity
        run: npm run check:incremental
      - name: DOM patching
        run: npm run check:dom
      - name: Outline seam advances
        run: npm run check:advances
      - name: Mesh raster parity
        run: npm run check:mesh
      - name: Viewport raster parity
        run: npm run check:viewport
      - name: Outline raster parity
        run: npm run check:outline

  fuzz:
    name: Fuzz — parse then compile never panics (60s)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/xsvg-core/fuzz
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz the compiler, seeded with the dataset
        working-directory: crates/xsvg-core
        run: |
          mkdir -p fuzz/corpus/compile
          cargo fuzz run compile fuzz/corpus/compile ../../dataset -- \
            -dict=fuzz/xsvg.dict -max_len=16384 -timeout=10 -max_total_time=60
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/xsvg-core/fuzz/artifacts
          if-no-files-found: ignore

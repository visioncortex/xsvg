# xsvg — Rust workspace (pure-Rust core, compiles to WASM and native).
# The crate layout is docs/Plan.md §1.2: `gradient` (mesh engine), `xsvg-schema` +
# `xsvg-schema-derive` (element parameter schemas), `xsvg-core` (the compiler),
# `xsvg-plugin` (the generator ABI), `xsvg-wasm` and `xsvg-cli` (the two hosts), and
# `ext/clipart` (the official extension module). CHANGELOG.md: every crate shares one version.
[workspace]
resolver = "2"
members = [
    "crates/gradient",
    "crates/xsvg-core",
    "crates/xsvg-cli",
    "crates/xsvg-wasm",
    "crates/xsvg-plugin",
    "crates/xsvg-schema",
    "crates/xsvg-schema-derive",
    "crates/ext/clipart",
]
# The fuzz targets are their own workspace (they link libFuzzer and need nightly);
# see crates/xsvg-core/fuzz/Cargo.toml.
exclude = ["crates/xsvg-core/fuzz"]

[profile.release]
opt-level = "s"   # optimize wasm for size (v0 wants a tiny bundle)
lto = true
codegen-units = 1

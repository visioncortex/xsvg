[package]
name = "xsvg-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/visioncortex/xsvg"
description = "Headless (browser-free) xsvg compiler: xsvg in, plain SVG out. Native fonts via ttf-parser."
readme = "README.md"

[[bin]]
name = "xsvg"
path = "src/main.rs"

[dependencies]
xsvg-core = { path = "../xsvg-core", version = "0.1.0", features = ["compile"] }
ttf-parser = "0.25"
wasmi = { version = "1.1", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
xsvg-plugin = { version = "0.1.0", path = "../xsvg-plugin" }
